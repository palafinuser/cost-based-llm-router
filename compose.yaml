services:
  db:
    image: postgres:17
    container_name: cost_router_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: router_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cost_router

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router_user -d cost_router"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: